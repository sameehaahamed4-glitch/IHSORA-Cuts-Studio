<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IHSORA Cuts Studio</title>
<meta name="description" content="IHSORA Cuts Studio: video editing and Photoshop design by Sam. Your Vision. Our Creative Touch.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--card:#141210;--line:#2e2718;--gold:#d4af37;--gold2:#f3d97a;--tx:#f2ede0;--mut:#a9a08a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 Inter,system-ui,sans-serif}
h1,h2,h3,.serif{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;line-height:1.15;margin:0}
.gold{background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
a{color:var(--gold2)}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
section{padding:56px 0}
h2{font-size:clamp(28px,4vw,40px);margin-bottom:8px}
.sub{color:var(--mut);max-width:680px;margin:0 0 28px}
header{position:sticky;top:0;z-index:20;background:rgba(10,10,10,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:76px}
.lg{display:block;height:auto;aspect-ratio:1/1;object-fit:contain;mix-blend-mode:lighten}
.logo .lg{width:68px;height:68px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hero .lg{margin:0 auto}
.lg.big{width:min(360px,78vw)}
.lg.mid{width:min(150px,40vw)}
.lg.ft{width:150px;margin:0 auto 6px}
.logo{display:block;line-height:0;text-decoration:none}
nav{display:flex;gap:4px}
nav a{color:var(--tx);text-decoration:none;font-size:14px;padding:8px 10px;border-radius:6px}
nav a:hover,nav a.on{color:var(--gold2);background:#1b1710}
#mb{display:none;background:none;border:1px solid var(--line);color:var(--gold);border-radius:6px;padding:8px 12px;font-size:15px}
@media(max-width:900px){#mb{display:block}nav{display:none;position:absolute;left:0;right:0;top:76px;background:var(--bg);flex-direction:column;padding:10px 20px 16px;border-bottom:1px solid var(--line)}nav.open{display:flex}}
.btn{display:inline-block;padding:12px 22px;border-radius:999px;font:600 14px Inter,sans-serif;text-decoration:none;border:1px solid var(--gold);cursor:pointer;margin:4px 8px 4px 0}
.btn.p{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#111}
.btn.s{background:transparent;color:var(--gold2)}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.hero{padding:88px 0 64px;text-align:center;background:radial-gradient(ellipse at 50% 0,#2a2108 0,transparent 60%)}
.hero h1{font-size:clamp(40px,8vw,76px);letter-spacing:.06em}
.hero .hi{font:600 clamp(22px,3vw,30px) "Cormorant Garamond",Georgia,serif;margin:18px 0 6px}
.hero em{color:var(--gold2);font-family:"Cormorant Garamond",Georgia,serif;font-size:20px}
.hero p{max-width:640px;margin:14px auto;color:var(--mut)}
.tag{letter-spacing:.3em;font-size:12px;color:var(--mut);text-transform:uppercase}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.card h3{font-size:24px;color:var(--gold2);margin-bottom:6px}
.card p{margin:0;color:var(--mut);font-size:15px}
.price{font:700 34px "Cormorant Garamond",Georgia,serif;color:var(--gold)}
.price small{font:400 13px Inter,sans-serif;color:var(--mut)}
.tier{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.card ul{padding-left:18px;margin:12px 0 16px;font-size:14.5px}
.pk h3{margin:36px 0 12px;font-size:28px}
.note{border-left:3px solid var(--gold);background:#15120b;padding:12px 16px;border-radius:0 8px 8px 0;color:var(--mut);font-size:14.5px;margin:20px 0}
.ph{aspect-ratio:16/10;border-radius:10px;background:linear-gradient(135deg,#1c1608,#0d0b06);border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:13px;text-align:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.badge{display:inline-block;font-size:11px;border:1px solid var(--gold);color:var(--gold2);border-radius:99px;padding:2px 10px;margin:10px 0 4px}
.tech{font-size:13px;color:var(--mut)}
.steps{counter-reset:s}
.steps .card::before{counter-increment:s;content:"0" counter(s);font:700 34px "Cormorant Garamond",Georgia,serif;color:var(--gold);display:block}
form{display:grid;gap:14px;grid-template-columns:1fr 1fr}
form .f{grid-column:1/-1}
label{font-size:13px;color:var(--mut);display:block;margin-bottom:4px}
input,select,textarea{width:100%;background:#0f0d09;border:1px solid var(--line);border-radius:8px;color:var(--tx);padding:11px;font:inherit}
@media(max-width:620px){form{grid-template-columns:1fr}}
footer{border-top:1px solid var(--line);padding:28px 0;text-align:center;color:var(--mut);font-size:13px}
.pg{display:none}.pg.on{display:block;animation:fi .5s}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.pg.on{animation:none}html{scroll-behavior:auto}}
</style>
</head>

/* PORTFOLIO: replace each item. img = path/URL of preview (leave "" for placeholder),
   url = link to the work (leave "" until ready), concept:true labels self-made samples. */
const VIDEO_PORTFOLIO = [
 {cat:"Podcast edit",title:"Podcast Edit Sample",desc:"Placeholder for a podcast episode edit.",tech:"Cuts, audio cleanup, captions",img:"",url:"",concept:true},
 {cat:"Instagram Reel",title:"Reel Sample",desc:"Placeholder for a vertical Reel.",tech:"Hook editing, captions, music sync",img:"",url:"",concept:true},
 {cat:"YouTube Short",title:"Short Sample",desc:"Placeholder for a YouTube Short.",tech:"Pacing, text overlays, sound effects",img:"",url:"",concept:true},
 {cat:"AI-assisted video",title:"AI-Assisted Sample",desc:"Placeholder for an AI-assisted video.",tech:"AI visuals, sequencing, sound design",img:"",url:"",concept:true},
 {cat:"Colour grading",title:"Video Grade Sample",desc:"Placeholder for a before/after video grade.",tech:"Exposure, white balance, creative grade",img:"",url:"",concept:true}
];
const DESIGN_PORTFOLIO = [
 {cat:"Photo retouching",title:"Retouch Sample",desc:"Placeholder for a retouched photo.",tech:"Photoshop retouching, lighting",img:"",url:"",concept:true},
 {cat:"Photo colour grading",title:"Photo Grade Sample",desc:"Placeholder for a graded photo.",tech:"Colour grading, tonal balance",img:"",url:"",concept:true},
 {cat:"YouTube thumbnail",title:"YouTube Thumbnail Sample",desc:"Placeholder for a YouTube thumbnail.",tech:"Cut-outs, composition, typography",img:"",url:"",concept:true},
 {cat:"Instagram thumbnail",title:"Instagram Cover Sample",desc:"Placeholder for an Instagram cover.",tech:"Layout, colour, text hierarchy",img:"",url:"",concept:true},
 {cat:"Poster",title:"Poster Sample",desc:"Placeholder for a poster.",tech:"Layout, typography, image treatment",img:"",url:"",concept:true},
 {cat:"Banner",title:"Banner Sample",desc:"Placeholder for a banner.",tech:"Composition, effects, brand colours",img:"",url:"",concept:true}
];
/* ===================== END EDIT AREA ===================== */

const PAGES = [["home","Home"],["video","Video Editing"],["design","Photoshop & Design"],["portfolio","Portfolio"],["pricing","Pricing"],["about","About"],["contact","Contact"]];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const svcCards = list => `<div class="grid">${list.map(s=>`<div class="card"><h3>${esc(s[0])}</h3><p>${esc(s[1])}</p>${s[2]?`<p style="margin-top:12px"><a href="${s[2]}">View in Photoshop &amp; Design &rarr;</a></p>`:""}</div>`).join("")}</div>`;
const pricing = list => `<div class="pk">${list.map(s=>`<h3 class="serif">${esc(s.t)}</h3>${s.note?`<div class="note">${esc(s.note)}</div>`:""}<div class="grid">${s.p.map((x,i)=>`<div class="card"><div class="tier">${TIERS[i]}</div><div class="price">${R(x[0])} <small>per ${s.u}</small></div><ul>${x[1].map(b=>`<li>${esc(b)}</li>`).join("")}</ul><a class="btn s" href="#contact">Get a Quote</a></div>`).join("")}</div>`).join("")}</div><p class="tech">All prices are starting prices for the scope listed, in INR.</p>`;
const gallery = list => `<div class="grid">${list.map(i=>`<article class="card"><div class="ph">${i.img?`<img src="${esc(i.img)}" alt="${esc(i.title)}" loading="lazy">`:"Preview placeholder"}</div><span class="badge">${i.concept?"Concept project":esc(i.cat)}</span><h3>${esc(i.title)}</h3><p>${esc(i.desc)}</p><p class="tech">Techniques: ${esc(i.tech)}</p><p style="margin-top:10px">${i.url?`<a href="${esc(i.url)}" target="_blank" rel="noopener">View work &rarr;</a>`:`<span class="tech">Link coming soon</span>`}</p></article>`).join("")}</div>`;
const sec = (id,h,sub,body) => `<section id="${id}"><div class="wrap"><h2 class="gold">${h}</h2><p class="sub">${sub}</p>${body}</div></section>`;
const hero = (h,p) => `<div class="hero"><div class="wrap"><img class="lg mid" src="${LOGO}" alt="IHSORA Cuts Studio logo" width="150" height="150"><h1 class="gold" style="margin-top:8px">${h}</h1><p>${p}</p><a class="btn p" href="#contact">Get a Quote</a></div></div>`;
const process = `<div class="grid steps">${[["Discuss","Understand the client’s requirements, references and budget."],["Plan","Confirm the scope, package, deliverables and deadline."],["Create","Edit the video, enhance the photograph or develop the design."],["Deliver","Provide the final files and complete the agreed revisions."]].map(s=>`<div class="card"><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join("")}</div>`;
const links = () => [["Email",CONTACT.email&&"mailto:"+CONTACT.email],["WhatsApp",CONTACT.whatsapp&&"https://wa.me/"+CONTACT.whatsapp],["Instagram",CONTACT.instagram],["LinkedIn",CONTACT.linkedin]].map(l=>`<div class="card"><h3>${l[0]}</h3>${l[1]?`<p><a href="${esc(l[1])}" target="_blank" rel="noopener">${l[1].replace(/^mailto:/,"")}</a></p>`:`<p>Add your ${l[0]} in the CONTACT settings</p>`}</div>`).join("");

const VIEWS = {
 home: () => `<div class="hero"><div class="wrap"><img class="lg big" src="${LOGO}" alt="IHSORA Cuts Studio logo" width="360" height="360"><h1 class="sr">IHSORA Cuts Studio</h1><div class="tag">Your Vision. Our Creative Touch.</div><div class="hi">Hi, I am Sam.</div><em>Turning ideas into cinematic visuals and creative designs.</em><p>I am a beginner freelance video editor and Photoshop designer who enjoys transforming raw footage, photographs and creative ideas into polished visual content.</p><p>I help creators, individuals and businesses with engaging video edits, attractive thumbnails, photo enhancement and promotional designs.</p><a class="btn p" href="#portfolio">Explore My Work</a><a class="btn s" href="#video">View Services</a><a class="btn s" href="#contact">Get a Quote</a></div></div>`
  + sec("cats","Two Creative Services","Each with its own services, pricing and portfolio.",`<div class="grid"><div class="card"><h3>Video Editing</h3><p>Podcasts, Reels, Shorts, AI-assisted videos and colour grading.</p><p style="margin-top:14px"><a class="btn p" href="#video">Explore Video Editing</a></p></div><div class="card"><h3>Photoshop &amp; Design</h3><p>Retouching, photo grading, thumbnails, posters and banners.</p><p style="margin-top:14px"><a class="btn p" href="#design">Explore Design</a></p></div></div>`)
  + sec("proc","How I Work","Four simple steps from idea to delivery.",process),
 video: () => hero("Video Editing","Podcasts, Reels, Shorts, AI-assisted videos and colour grading, edited with care.")
  + sec("vs","Video Services","What I can edit for you.",svcCards(VIDEO_SERVICES))
  + sec("vp","Video Editing Pricing","Starting prices in INR.",pricing(VIDEO_PRICING))
  + sec("vg","Video Editing Portfolio","Sample work. Replace placeholders in the VIDEO_PORTFOLIO list.",gallery(VIDEO_PORTFOLIO)),
 design: () => hero("Photoshop &amp; Design","Photo retouching, colour grading, thumbnails, posters and banners.")
  + sec("ds","Design Services","What I can create for you.",svcCards(DESIGN_SERVICES))
  + sec("dp","Photoshop &amp; Design Pricing","Starting prices in INR.",pricing(DESIGN_PRICING))
  + sec("dg","Photoshop &amp; Design Portfolio","Sample work. Replace placeholders in the DESIGN_PORTFOLIO list.",gallery(DESIGN_PORTFOLIO)),
 portfolio: () => sec("pv","Video Editing Portfolio","Podcasts, Reels, Shorts, AI-assisted videos and colour grading.",gallery(VIDEO_PORTFOLIO)) + sec("pd","Photoshop &amp; Design Portfolio","Retouching, grading, thumbnails, posters and banners.",gallery(DESIGN_PORTFOLIO)) + `<div class="wrap"><div class="note">Samples labelled “Concept project” are self-created, not paid client work.</div></div>`,
 pricing: () => sec("pr1","Video Editing Pricing","Starting prices in INR.",pricing(VIDEO_PRICING)) + sec("pr2","Photoshop &amp; Design Pricing","Starting prices in INR.",pricing(DESIGN_PRICING)),
 about: () => sec("ab","Meet Sam — Founder of IHSORA Cuts Studio","",`<div class="card"><p style="font-size:17px;color:var(--tx)">I am a beginner freelance creative focused on video editing, Photoshop design and visual storytelling. I am building my portfolio through hands-on projects, experimentation and continuous learning.</p><p style="font-size:17px;color:var(--tx);margin-top:12px">My aim is to create engaging videos, refined photographs and attractive designs that help clients present their ideas professionally.</p></div>`) + sec("wp","Work Process","",process),
 contact: () => sec("ct","Let’s Create Something Exceptional.","Tell me about your project, or reach out directly.",`<div class="grid" style="margin-bottom:32px">${links()}</div><form id="enq" novalidate>
  <div><label for="n">Client name</label><input id="n" required></div><div><label for="c">Contact information</label><input id="c" required></div>
  <div><label for="s">Service required</label><select id="s"><optgroup label="Video Editing">${["Podcast Editing","Instagram Reels","YouTube Shorts","AI-Assisted Video","Video Colour Grading"].map(x=>`<option>${x}</option>`).join("")}</optgroup><optgroup label="Photoshop &amp; Design">${["Photo Retouching","Photo Colour Grading","YouTube Thumbnail","Instagram Thumbnail","Poster","Banner"].map(x=>`<option>${x}</option>`).join("")}</optgroup></select></div>
  <div><label for="k">Preferred package</label><select id="k"><option>Basic</option><option>Standard</option><option>Premium</option><option>Not sure yet</option></select></div>
  <div class="f"><label for="r">Video or design requirements</label><textarea id="r" rows="4"></textarea></div>
  <div><label for="b">Budget (INR)</label><input id="b"></div><div><label for="d">Deadline</label><input id="d" type="date"></div>
  <div class="f"><label for="l">Reference links</label><input id="l"></div>
  <div class="f"><button class="btn p" type="submit">Send Enquiry</button><p id="msg" class="tech" role="status"></p></div></form>`)
};

const app = document.getElementById("app"), nav = document.getElementById("nav"), mb = document.getElementById("mb");
document.querySelectorAll("img.lg:not([src])").forEach(i=>i.src=LOGO);
const ic=document.createElement("link");ic.rel="icon";ic.href=LOGO;document.head.appendChild(ic);
nav.innerHTML = PAGES.map(p=>`<a href="#${p[0]}" data-p="${p[0]}">${p[1]}</a>`).join("");
function route(){
  const p = (location.hash.slice(1) || "home");
  const pg = VIEWS[p] ? p : "home";
  app.innerHTML = VIEWS[pg]();
  nav.querySelectorAll("a").forEach(a => a.classList.toggle("on", a.dataset.p === pg));
  nav.classList.remove("open"); mb.setAttribute("aria-expanded","false");
  const t = document.getElementById(p);
  if(t && !VIEWS[p]) t.scrollIntoView(); else window.scrollTo(0,0);
  const f = document.getElementById("enq");
  if(f) f.onsubmit = e => {
    e.preventDefault();
    const v = id => document.getElementById(id).value.trim(), m = document.getElementById("msg");
    if(!v("n") || !v("c")){ m.textContent = "Please add your name and contact information."; return; }
    const body = `Name: ${v("n")}\nContact: ${v("c")}\nService: ${v("s")}\nPackage: ${v("k")}\nBudget: ${v("b")}\nDeadline: ${v("d")}\nReferences: ${v("l")}\n\nRequirements:\n${v("r")}`;
    if(CONTACT.email){ location.href = "mailto:"+CONTACT.email+"?subject="+encodeURIComponent("Project enquiry: "+v("s"))+"&body="+encodeURIComponent(body); m.textContent = "Opening your email app to send the enquiry."; }
    else if(CONTACT.whatsapp){ window.open("https://wa.me/"+CONTACT.whatsapp+"?text="+encodeURIComponent(body),"_blank"); m.textContent = "Opening WhatsApp."; }
    else m.textContent = "This form is not connected yet. Add an email or WhatsApp number in the CONTACT settings.";
  };
}
mb.onclick = () => mb.setAttribute("aria-expanded", nav.classList.toggle("open"));
addEventListener("hashchange", route);
document.getElementById("yr").textContent = new Date().getFullYear();
route();
</script>
</body>
